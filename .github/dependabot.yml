version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
    # Expo pins these per SDK release; upgrade them with `npx expo install --fix`
    # as part of an SDK upgrade instead of letting Dependabot bump them one by one.
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: 'typescript'
      # Majors must wait for eslint-config-expo / jest-expo to support them
      # (ESLint 10 breaks eslint-plugin-react; jest-expo 57 targets Jest 29).
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
